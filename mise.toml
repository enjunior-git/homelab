[tools]
age = "latest"
cloudflared = "latest"
flux2 = "latest"
"github:cloudnative-pg/cloudnative-pg" = "latest"
helm = "latest"
k9s = "latest"
kubectl = "latest"
sops = "latest"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"

[tasks.encrypt-secret]
description = "Encrypts a secret file using SOPS and age"
run = "{{config_root}}/scripts/encrypt-secret"
