apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.0
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - mountPath: "/config"
              name: audiobookshelf-config
            - mountPath: "/metadata"
              name: audiobookshelf-metadata
            - mountPath: "/audiobooks"
              name: audiobookshelf-audiobooks
            - mountPath: "/podcasts"
              name: audiobookshelf-podcasts
      #securityContext: # TODO: Run as node user
      #  fsGroup: 82
      #  runAsUser: 82
      #  runAsGroup: 82
      volumes:
        - name: audiobookshelf-config
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
        - name: audiobookshelf-metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
        - name: audiobookshelf-audiobooks
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
        - name: audiobookshelf-podcasts
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
