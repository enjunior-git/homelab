apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mealie
  name: mealie
  namespace: mealie
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mealie

  template:
    metadata:
      labels:
        app: mealie

    spec:
      containers:
        - image: ghcr.io/mealie-recipes/mealie:v3.21.0
          name: mealie
          ports:
            - containerPort: 9000

          volumeMounts:
            - mountPath: "/app/data"
              name: mealie-data

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m

          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      
      # abc user
      securityContext:
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911

      seccompProfile:
        type: RuntimeDefault

      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
