apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1

  selector:
    matchLabels:
      app: n8n

  template:
    metadata:
      labels:
        app: n8n

    spec:
      containers:
        - image: n8nio/n8n:2.45.4
          name: n8n
          ports:
            - containerPort: 5678

          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-data
            - mountPath: /home/node/.cache
              name: n8n-cache

          envFrom:
            - configMapRef:
                name: n8n-configmap
            - secretRef:
                name: n8n-secrets

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-storage
        - name: n8n-cache
          emptyDir: {}
