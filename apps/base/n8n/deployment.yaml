apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1

  selector:
    matchLabels:
      app: n8n

  template:
    metadata:
      labels:
        app: n8n

    spec:
      containers:
        - image: n8nio/n8n:2.40.6
          name: n8n
          ports:
            - containerPort: 5678

          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-data

          envFrom:
            - configMapRef:
                name: n8n-configmap

          securityContext:
            allowPrivilegeEscalation: false

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-storage
