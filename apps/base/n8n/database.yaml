apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db-v3
  namespace: n8n
spec:
  instances: 2

  bootstrap:
    # initdb:
    #   database: app
    #   owner: n8n
    #   secret:
    #     name: n8n-db-credentials
        
    recovery:
      database: app
      owner: n8n
      source: source
      secret:
        name: n8n-db-credentials
  
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: n8n-objectstore
          serverName: n8n-db2

  storage:
    size: 1Gi

  postgresql:
    parameters:
      archive_timeout: 12h
      wal_keep_size: 64MB

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-objectstore
        serverName: n8n-db-v3
