apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - start.enjunior.ca
      secretName: start-tls
  rules:
    - host: start.enjunior.ca
      http:
        paths:
          - backend:
              service:
                name: homepage
                port:
                  number: 4321
            path: /
            pathType: Prefix
