apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox
  namespace: proxmox
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - proxmox.enjunior.ca
      secretName: proxmox-tls
  rules:
    - host: proxmox.enjunior.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxmox
                port:
                  number: 8006