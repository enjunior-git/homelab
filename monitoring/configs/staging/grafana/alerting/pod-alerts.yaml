apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-pod
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  pod-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: Pod Alerts
        folder: Kubernetes
        interval: 5m
        rules:
          - uid: infra003podnotready
            title: Pod Not Ready
            condition: A
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: |
                    (
                      kube_pod_status_ready{job="kube-state-metrics",condition="true"} == 0
                    )
                    and on (namespace, pod)
                    (
                      kube_pod_status_phase{job="kube-state-metrics",phase=~"Pending|Running|Unknown"} == 1
                    )
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Pending or Unknown state for more than 5 minutes'
              summary: 'Pod stuck in non-running state'
            labels:
              severity: warning
            isPaused: false

          - uid: infra004podcrashloop
            title: Pod CrashLoopBackOff
            condition: A
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: |
                    kube_pod_container_status_waiting_reason{
                      job="kube-state-metrics",
                      reason="CrashLoopBackOff"
                    } == 1
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
            noDataState: OK
            execErrState: Error
            for: 2m
            annotations:
              description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is CrashLoopBackOff'
              summary: 'Pod container is crash looping'
            labels:
              severity: critical
            isPaused: false
